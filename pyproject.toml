[project]
name = "my-project"
version = "0.1.0"
description = "Agent + WinUI monorepo (bootstrap phase)"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = {text = "Proprietary"}
authors = [{name = "Project Team"}]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
]
# Windows agent runtime (named pipes server). Install with:
#   pip install -e ".[agent]"
# pywin32 provides the Win32 named pipe APIs matching the C# client framing.
agent = [
    "pywin32; sys_platform == 'win32'",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".venv*",
    "spike/ipc/.venv-spike",
    "spike/ipc/_tmp/",
    "spike/ipc/*.exe",
    "spike/ipc/*.zip",
    "spike/ipc/spike-results*.json",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = [
    ".venv*",
    "spike/ipc/.venv-spike",
    "spike/ipc/_tmp/",
    "spike/ipc/*.exe",
    "spike/ipc/*.zip",
    "spike/ipc/spike-results*.json",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent*"]
